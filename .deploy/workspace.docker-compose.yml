# File has been autogenerated using build-one cli, please do not modify manually.
volumes:
  ah_db_storage: 
  app_db_storage: 
  b1_db_storage: 
  swat_app_uploads: 
networks:
  app-network: 
services:
  caddy:
    image: docker.cloudsmith.io/buildone/repository/buildone-caddy:${BUILDONE_VERSION}
    restart: unless-stopped
    networks:
      app-network: 
    command:
      - caddy
      - run
      - '--config'
      - /etc/caddy/Caddyfile
      - '--adapter'
      - caddyfile
    ports:
      - '8080:8080'
      - '8081:8081'
  b1_db_server:
    image: docker.cloudsmith.io/buildone/repository/build-one-postgres-db:17-2
    restart: unless-stopped
    environment:
      - RESET_DATABASES=${RESET_DATABASES:-FALSE}
    healthcheck:
      test:
        - CMD-SHELL
        - /wait_for_db.sh
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      app-network: 
    volumes:
      - b1_db_storage:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  swat_app_server_ts:
    image: docker.cloudsmith.io/buildone/repository/buildone-swat-app-server-ts:${BUILDONE_VERSION}
    restart: unless-stopped
    environment:
      - AH_CREDENTIALS=${AH_CREDENTIALS:-}
      - IMPORT_DATA=false
      - PORT=3000
      - UPLOAD_DIR=/app-data/uploads
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - B1_DATA_FOLDER=/data/b1
      - APP_DATA_FOLDER=/data/app
      - B1_DATABASE_URL=${B1_DATABASE_URL:-postgres://${B1_DATABASE_CREDENTIALS:-}@b1_db_server:5432/b1?sslmode=disable}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - B1_AUTOMATION_HUB_USER=${B1_AUTOMATION_HUB_USER}
      - B1_AUTOMATION_HUB_EMAIL=${B1_AUTOMATION_HUB_EMAIL}
      - B1_AUTOMATION_HUB_PASSWORD=${B1_AUTOMATION_HUB_PASSWORD}
      - AUTHENTICATION_TRUSTED_ORIGINS=${APP_URL},${DESIGNER_URL},http://localhost:8080,http://localhost:8081,https://localhost:8080,https://localhost:8081
      - REPOSITORY_SERVICE_TYPE=POSTGRES
      - LEGACY_APPLICATION_APPURL=${APP_URL:-}
      - LEGACY_AUTHENTICATION_ALLOWEDAUTHENTICATION=${ALLOWED_AUTHENTICATION:-AkiomaUser}
      - LEGACY_AUTHENTICATION_SSOAUTHENTICATIONURI=http://swat_app_server_ts:3000
      - LEGACY_AUTHENTICATION_AUTHENTICATIONOIDCROLEID=undefined
      - LEGACY_ENVIRONMENT_URL=${APP_URL:-}
      - LEGACY_INTEGRATION_GOOGLEAPIKEY=${GOOGLEAPIKEY:-}
      - LEGACY_INTEGRATION_KENDOLICENSEKEY=${KENDO_LICENSE_KEY:-}
    networks:
      app-network: 
    volumes:
      - ${WORKSPACE_ROOT}/data:/app-data
      - ${WORKSPACE_ROOT}/node_modules/@buildone/swat-data:/data/b1
      - ${WORKSPACE_ROOT}/src/data:/data/app
    depends_on:
      b1_db_server:
        condition: service_healthy
    init: true
    ports:
      - '3000:3000'
  app_db_server:
    image: docker.cloudsmith.io/buildone/repository/build-one-postgres-db:17-2
    restart: unless-stopped
    environment:
      - POSTGRES_DB=app_db
      - RESET_DATABASES=${RESET_DATABASES:-FALSE}
    healthcheck:
      test:
        - CMD-SHELL
        - /wait_for_db.sh
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      app-network: 
    volumes:
      - app_db_storage:/var/lib/postgresql/data
    ports:
      - '15432:5432'
  app_server_ts:
    restart: unless-stopped
    environment:
      - PORT=3000
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgres://${APP_DATABASE_CREDENTIALS:-}@app_db_server:5432/app_db?sslmode=disable}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NODE_ENV=development
    networks:
      app-network: 
    depends_on:
      app_db_server:
        condition: service_healthy
    build:
      context: ${BUILDONE_CLI_WORKSPACE}/deploy
      dockerfile: dev.Dockerfile
    init: true
    ports:
      - '3001:3000'
      - '3011:9229'
    working_dir: /workspace/src/app-server-ts
    command: ./start.sh
    volumes:
      - ${WORKSPACE_ROOT}:/workspace
  n8n_db_server:
    image: docker.cloudsmith.io/buildone/repository/automation-hub-db:1.11.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /wait_for_db.sh
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      app-network: 
    volumes:
      - ah_db_storage:/var/lib/postgresql/data
  n8n:
    image: docker.cloudsmith.io/buildone/repository/automation-hub-1-114-3-2:1.11.0
    restart: unless-stopped
    environment:
      - AUTHENTICATION_URI=http://swat_app_server_ts:3000
      - DB_POSTGRESDB_HOST=n8n_db_server
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_URL}
      - B1_N8N_ENV=devel
    networks:
      app-network: 
    depends_on:
      n8n_db_server:
        condition: service_healthy
    ports:
      - '5678:5678'
    volumes:
      - ${WORKSPACE_ROOT}:/workspace
  web-app:
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - APP_URL=${APP_URL:-}
    networks:
      app-network: 
    build:
      context: ${BUILDONE_CLI_WORKSPACE}/deploy
      dockerfile: dev.Dockerfile
    working_dir: /workspace/src/web-app
    command: npm run dev
    volumes:
      - ${WORKSPACE_ROOT}:/workspace
  pg-admin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      - PGADMIN_CONFIG_X_FRAME_OPTIONS=""
      - PGADMIN_CONFIG_ALLOW_FRAMING=True
      - PGADMIN_CONFIG_PROXY_X_HOST_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_FOR_COUNT=1
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
      - PGADMIN_CONFIG_CSRF_TRUSTED_ORIGINS=['https://*.github.dev']
      - PGADMIN_DEFAULT_EMAIL=${B1_AUTOMATION_HUB_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${B1_AUTOMATION_HUB_PASSWORD}
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD=False
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=10
    ports:
      - '2021:80'
    networks:
      app-network: 
    volumes:
      - ${BUILDONE_CLI_WORKSPACE}/pgadmin.servers.json:/pgadmin4/servers.json
  web-docs:
    image: docker.cloudsmith.io/buildone/repository/buildone-web-docs:24.3.0-VG.18
    restart: unless-stopped
    ports:
      - '5173:80'
