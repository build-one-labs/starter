name: Data check

# Fails a pull request that leaves blueprint data `b1 import` would refuse, fail
# on, lose, or import as references to nothing: files in an older repository
# format, unparsable JSON, a guid in two files, names that clash with the
# framework's, instances of objects that do not exist.
#
# Runs `b1 check-data`, which reads the blueprint JSON, the migration ledger and
# git — no stack, no database. Problems that make the import fail are errors
# wherever they are; the others are errors only in files the pull request adds
# or changes, and warnings elsewhere. Run this workflow by hand to check the
# whole repository strictly: it then fails on every finding.
# See node_modules/@buildone/swat-cli/knowledge/blueprint_dsl/data-check.md.

on:
  pull_request:
    paths:
      - 'src/data/**'
      - '.b1/migrations.json'
      - '.build/migrations.json'
      # A framework update (b1 update) changes which framework objects the
      # project's references resolve against, and which migrations the ledger
      # has to list. app-server-ts is the workspace that depends on
      # @buildone/swat-data and @buildone/app-server-tslib, where the rules are.
      - 'package.json'
      - 'src/app-server-ts/package.json'
      - 'yarn.lock'
      - '.github/workflows/data-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installing the CLI needs the package registry, and its credentials come from
  # the secret store through two Actions secrets. A repository that has not been
  # provisioned yet gets a notice here instead of a red check on every pull
  # request. A step `if:` cannot read the `secrets` context, hence a job.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      AUTH_URL: ${{ secrets.AUTH_URL }}
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    steps:
      - name: Check the credentials this run needs
        id: check
        run: |
          if [[ -n "${AUTH_URL}" && -n "${B1_ORG_API_KEY}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=Data check skipped::AUTH_URL and B1_ORG_API_KEY are not set for this repository, so the CLI cannot be installed."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

  check:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      # Depth 2 for HEAD^1, the merge commit's first parent: exactly what this pull
      # request was merged with, even in a re-run after the base branch has moved.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Fetch this repository's secrets
        uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY

      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          # app-server-ts brings @buildone/swat-data, the framework's objects, and
          # @buildone/app-server-tslib, the rules. Without them the check fails.
          focus-workspaces: app app-server-ts data

      - name: Check that the blueprint data imports cleanly
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          SCOPE: ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '--all' }}
        run: yarn b1 check-data ${SCOPE}
