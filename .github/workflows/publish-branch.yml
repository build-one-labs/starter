name: Publish Branch
run-name: Publish Branch ${{ inputs.version }}

# Dispatched by the Release & Deploy screen's "Create Release" action. Computes the
# version (GitVersion, or the exact `version` for "custom" mode), creates & pushes the
# tag, AND builds & publishes every image in the same run. Tagging alone (tag.yml) is
# avoided for this path because a GITHUB_TOKEN tag push does not fire publish.yml's
# push trigger, which would leave the tag un-built.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact tag to publish (or "auto" to compute from the branch)'
        required: false
        default: auto
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: auto
    secrets:
      B1_ACCESS_KEY_ID:
        required: true
      B1_SECRET_ACCESS_KEY:
        required: true

# `contents: write` so the version job can push the tag; `statuses: write` so the
# marker job can set the commit status.
permissions:
  contents: write
  statuses: write

env:
  AWS_REGION: eu-central-1
  DOCKER_REPOSITORY: 653306034207.dkr.ecr.eu-central-1.amazonaws.com/starter
  APP_NAME: starter

jobs:
  # ---------------------------------------------------------------------------
  # Compute the version and create + push the tag on the dispatched branch.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Create tag
        id: version
        env:
          WORKSPACE_ROOT: .
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # "auto" (or empty) lets `b1 tag` compute the version from the branch;
          # an explicit value is used verbatim (the screen's "custom" mode).
          npx b1 tag "${INPUT_VERSION:-auto}"
          git push --tags
          # The newest tag reachable from HEAD is the one just created.
          VERSION=$(git describe --tags --abbrev=0)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagged $VERSION"

  publish-app-server-ts:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts data
      - name: Build
        run: yarn workspace app-server-ts build
      - name: Prune to production dependencies
        run: yarn workspaces focus app-server-ts --production
      - name: Prepare Dockerfile
        run: cp src/app-server-ts/Dockerfile ./Dockerfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-app-server-ts"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-app-server-ts" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  publish-web-app:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app web-app
      - name: Build
        run: yarn workspace web-app build
      - name: Prepare Dockerfile
        run: cp src/web-app/Dockerfile ./Dockerfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-web-app"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-web-app" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  publish-data:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app data
      - name: Prepare Dockerfile
        run: cp src/data/Dockerfile ./Dockerfile
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-data"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-data" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  # ---------------------------------------------------------------------------
  # Publish marker — sets the `build-one/publish` commit status on the tag's commit
  # once the image jobs finish (see publish.yml for the rationale).
  # ---------------------------------------------------------------------------
  mark-publish-status:
    name: Mark publish commit status
    needs:
      - version
      - publish-app-server-ts
      - publish-web-app
      - publish-data
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}
      - name: Set build-one/publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          # `version` is 'success' here (gated by the `if`), so it never flips STATE.
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          SHA=$(git rev-parse HEAD)
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            STATE=failure
          else
            STATE=success
          fi
          echo "Images ${STATE} for ${VERSION} (${SHA}); job results: ${RESULTS}"
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="build-one/publish" \
            -f description="Images ${STATE} for ${VERSION}"
