name: Publish Tag
# Carry the built version in the run title so consumers (e.g. the Release & Deploy
# "Deployable" gate) can attribute a run to its version.
run-name: Publish Tag ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['**']
  # Manual / programmatic (re)build of a tag whose images aren't in ECR — e.g. tags
  # created by tag.yml, whose GITHUB_TOKEN push does not fire the push trigger above.
  # The Release & Deploy screen's "Build images" action dispatches this.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build & publish (e.g. 1.4.0)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      B1_ACCESS_KEY_ID:
        required: true
      B1_SECRET_ACCESS_KEY:
        required: true
      PUBLISH_DOCKER_REPOSITORY:
        required: true
      PUBLISH_APP_NAME:
        required: true

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  DOCKER_REPOSITORY: ${{ secrets.PUBLISH_DOCKER_REPOSITORY }}
  APP_NAME: ${{ secrets.PUBLISH_APP_NAME }}
  # Tag from the push event, or the explicit input on manual/called runs.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  publish-app-server-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts data

      - name: Build
        run: yarn workspace app-server-ts build

      - name: Prune to production dependencies
        run: yarn workspaces focus app-server-ts --production

      - name: Prepare Dockerfile
        run: cp src/app-server-ts/Dockerfile ./Dockerfile

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-app-server-ts"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-app-server-ts" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  publish-web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app web-app

      - name: Build
        run: yarn workspace web-app build

      - name: Prepare Dockerfile
        run: cp src/web-app/Dockerfile ./Dockerfile

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-web-app"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-web-app" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  publish-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app data

      - name: Prepare Dockerfile
        run: cp src/data/Dockerfile ./Dockerfile

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REPOSITORY}/${APP_NAME}-data"
          docker build . -t "${IMAGE}:${VERSION}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date)" \
            --build-arg BUILD_NAME="${APP_NAME}-data" \
            --build-arg BUILD_IMAGE="${IMAGE}"
          docker push "${IMAGE}:${VERSION}"

  # ---------------------------------------------------------------------------
  # Publish marker — authoritative "Deployable" signal for the Release & Deploy
  # screen. Sets a `build-one/publish` commit status on the built commit once all
  # image jobs finish: success when every image reached ECR, failure otherwise.
  # The backend reads this status by the tag's commit sha.
  # ---------------------------------------------------------------------------
  mark-publish-status:
    name: Mark publish commit status
    needs:
      - publish-app-server-ts
      - publish-web-app
      - publish-data
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - name: Set build-one/publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          # Aggregate result of every image job above; tracks whatever is in `needs`.
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          SHA=$(git rev-parse HEAD)
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            STATE=failure
          else
            STATE=success
          fi
          echo "Images ${STATE} for ${VERSION} (${SHA}); job results: ${RESULTS}"
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="build-one/publish" \
            -f description="Images ${STATE} for ${VERSION}"
